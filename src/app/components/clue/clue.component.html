<ion-item class="clue" [color]="color">
  <span class="word">{{clue.word}}</span>
  <span class="guess-count">{{clue.guessCount}}</span>
  <span class="guesses" slot="end">
    <div class="guess-indicator {{tile.role}}" *ngFor="let tile of clue.guessesMade">

      <!-- picture tiles show their image in the tooltip; the width is set
           manually so it renders in the correct position -->
      <ng-container *ngIf="tile | tileSrc: assetUrlPattern | async as src; else wordTooltip">
        <div class="tooltip" [tooltip]="src" width="85"></div>
      </ng-container>
      <ng-template #wordTooltip>
        <div class="tooltip" [tooltip]="tile.word"></div>
      </ng-template>
      <img class="dart" src="../../../assets/{{ tile.dartedBy === 'BLUE' ? 'blue' : 'red' }}-dart.png" *ngIf="tile.dartedBy">
    </div>
  </span>
</ion-item>
