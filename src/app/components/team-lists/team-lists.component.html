<div class="ion-padding-start" *ngIf="game">
  <h3 class="team-title">
    <div class="team-score blue" *ngIf="showScore" tooltip="Remaining agents to find">
      {{ game.blueAgents }}
    </div>
    Blue Team
    <ion-button
      color="primary"
      size="small"
      (click)="joinTeam('blueTeam')"
      *ngIf="showJoinButton('blueTeam')">
      Join
    </ion-button>
    <ion-button
      fill="outline"
      color="primary"
      size="small"
      (click)="addBot('blueTeam')"
      *ngIf="canAddBot">
      🤖 Add bot
    </ion-button>
  </h3>
  <div class="bot-pending" *ngFor="let invite of pendingInvitesFor('blueTeam')">
    <ion-chip color="primary" outline="true">
      <ion-spinner name="dots"></ion-spinner>
      <ion-label>Bot invited, joining soon…</ion-label>
    </ion-chip>
  </div>
  <div class="team-member" *ngFor="let member of game.blueTeam.userIds">
    <div class="spy">
      <span *ngIf="game.blueTeam.spymaster === member">🕵</span>
    </div>
    <app-user
      [navToScorecard]="!setSpymaster"
      [showActions]="!game.completedAt && loggedInAndInRoom"
      [userId]="member"
      color="blue"
      (click)="userClicked(member, 'blueTeam')"
      (remove)="remove(member, 'blueTeam')"
      (setSpymaster)="assignSpymaster(member, 'blueTeam')"
    >
    </app-user>
  </div>
  <h3 class="team-title">
    <div class="team-score red" *ngIf="showScore" tooltip="Remaining agents to find">
      {{ game.redAgents }}
    </div>
    Red Team
    <ion-button
      color="danger"
      size="small"
      (click)="joinTeam('redTeam')"
      *ngIf="showJoinButton('redTeam')">
      Join
    </ion-button>
    <ion-button
      fill="outline"
      color="danger"
      size="small"
      (click)="addBot('redTeam')"
      *ngIf="canAddBot">
      🤖 Add bot
    </ion-button>
  </h3>
  <div class="bot-pending" *ngFor="let invite of pendingInvitesFor('redTeam')">
    <ion-chip color="danger" outline="true">
      <ion-spinner name="dots"></ion-spinner>
      <ion-label>Bot invited, joining soon…</ion-label>
    </ion-chip>
  </div>
  <div class="team-member" *ngFor="let member of game.redTeam.userIds">
    <div class="spy">
      <span *ngIf="game.redTeam.spymaster === member">🕵</span>
    </div>
    <app-user
      [navToScorecard]="!setSpymaster"
      [showActions]="!game.completedAt && loggedInAndInRoom"
      [userId]="member"
      color="red"
      (click)="userClicked(member, 'redTeam')"
      (remove)="remove(member, 'redTeam')"
      (setSpymaster)="assignSpymaster(member, 'redTeam')"
    >
    </app-user>
  </div>
  <div class="spectators" *ngIf="spectatorIds.length || anonymousWatchers">
    <h3 class="team-title spectator-title">Spectators</h3>
    <div class="team-member spectator" *ngFor="let userId of spectatorIds">
      <div class="spy"></div>
      <app-user [userId]="userId"></app-user>
    </div>
    <div class="team-member spectator anonymous" *ngIf="anonymousWatchers">
      <div class="spy"></div>
      <ion-chip outline="true">
        👀 {{ anonymousWatchers }} watching
      </ion-chip>
    </div>
  </div>
</div>
