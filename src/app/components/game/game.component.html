<!-- score and end turn -->
<div class="score-bar">
  <app-timer [game]="game" [room]="room"></app-timer>
  <div class="score-chips" tooltip="Agents remaining to find">
    <span class="score-chip blue">{{ game.blueAgents }}</span>
    <span class="score-chip red">{{ game.redAgents }}</span>
  </div>
  <div>
    <ion-button
      fill="outline"
      color="primary"
      (click)="openStats()"
      *ngIf="game.completedAt"
    >
      <ion-icon slot="start" name="podium-outline"></ion-icon>
      Stats
    </ion-button>
    <ion-button
      fill="outline"
      [color]="throwingDart ? 'danger' : 'medium'"
      (click)="toggleThrowingDart()"
      [disabled]="disableEndTurn"
      *ngIf="!spymaster && !game.completedAt"
    >
      {{ throwingDart ? "Cancel" : "Dart 🎯" }}
    </ion-button>
    <ion-button
      [class.completed]="!!game.completedAt"
      color="medium"
      (click)="endCurrentTeamsTurn()"
      [disabled]="disableEndTurn"
    >
      End Turn
    </ion-button>
  </div>
</div>

<ion-row class="game-row {{selectedTab}}">
  <!-- team lists on the left -->
  <app-team-lists
    class="team-lists"
    [room]="room"
    [game]="game"
    [showScore]="true">
  </app-team-lists>
  <!-- board in the middle -->
  <div class="game-board">
    <!-- persistent current clue banner -->
    <div
      class="clue-banner {{ turnColorClass }}"
      [class.live]="clueIsLive"
      *ngIf="room && !game.completedAt && game.tiles">
      <ng-container *ngIf="clueIsLive; else thinking">
        <!-- desktop: the live clue card from the history flies onto this slot -->
        <div class="clue-slot"></div>
        <!-- mobile keeps the inline banner (the history is below the fold) -->
        <div class="mobile-clue">
          <span class="clue-word">{{ currentClue.word }}</span>
          <span class="clue-count">{{ currentClue.guessCount }}</span>
          <span
            class="pips"
            tooltip="Guesses used — the last one is the bonus guess"
            *ngIf="!unlimitedGuesses">
            <span
              class="pip"
              [class.filled]="filled"
              [class.bonus]="i === cluePips.length - 1"
              *ngFor="let filled of cluePips; let i = index">
            </span>
          </span>
          <span class="pips-text" *ngIf="unlimitedGuesses">
            {{ guessesUsed }} guess{{ guessesUsed === 1 ? "" : "es" }} made · unlimited
          </span>
        </div>
      </ng-container>
      <ng-template #thinking>
        <span class="thinking">
          {{ turnTeam === "RED" ? "Red" : "Blue" }}'s spymaster is thinking<span class="dots">...</span>
        </span>
      </ng-template>
    </div>

    <app-game-board
      [room]="room"
      [game]="game"
      [currentClue]="currentClue"
      [readonly]="disableGameBoard"
      [spymaster]="spymaster"
      [throwingDart]="throwingDart"
      (clicked)="toggleThrowingDart(false)">
    </app-game-board>

    <!-- spymaster clue interface -->
    <app-give-clue
      [game]="game"
      [isMyTurn]="myTurn"
      [currentClueIsFromMyTeam]="currentClueIsFromMyTeam"
      *ngIf="spymaster && !game.completedAt">
    </app-give-clue>
  </div>
  <!-- word history on the right -->
  <app-word-history
    class="word-history"
    [game]="game">
  </app-word-history>
</ion-row>

<!-- spymaster chat -->
<app-chat-box [class]="selectedTab" [game]="game" *ngIf="spymaster || game.completedAt"></app-chat-box>

<!-- custom dart cursor -->
<div id="dart-cursor" [class.shown]="throwingDart">
  <img src="../../../assets/{{dartColor}}-dart.png">
</div>
